name: Windows native M0

# Build/tooling CI for the native Windows M0 path. QEMU/OVMF boot remains deliberately
# out of scope here and is validated on a configured development host: hosted runners
# have no nested virtualisation, so a hosted boot would measure TCG and prove less than
# the local boot already does.
#
# TRIGGERS
# --------
# Windows tooling defines half of the shared M0 compiler/linker contract (see
# .cargo/config.toml), so a change that reaches main without Windows validation can
# silently break the native Windows toolchain. main therefore gets both a pull_request
# and a push trigger.
#
# `pull_request` -- never `pull_request_target` -- so a fork's code is never run with
# access to this repository's context.
#
# PATHS
# -----
# Documentation-only changes must not consume Windows Actions minutes, which draw from
# the account's free monthly allowance (see ci.yml). The filter lists everything this
# job actually depends on. `core/**` deliberately subsumes the boot and ABI trees
# (core/abi, core/boot) rather than naming them again: an added path under core/ must
# be covered by default, and a filter that has to be remembered is a filter that will
# be forgotten.
#
# The workflow file itself is listed so a change to this CI definition is validated by
# the CI it defines.
#
# CONSEQUENCE, STATED EXPLICITLY: with path filters, a docs-only PR does not run this
# workflow at all. If it is ever made a REQUIRED status check, such a PR will block on
# a check that will never report. Making it required needs a companion always-runs job;
# that is not added here because the check is not required today.
#
# The two path lists below are duplicated verbatim on purpose: GitHub Actions does not
# support YAML anchors/aliases, so the usual way to share them does not work here. They
# must be kept identical.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-native-m0.yml'
      - '.cargo/**'
      - 'core/**'
      - 'tools/windows/**'
      - 'tools/lib.sh'
      - 'tools/scan-secrets'
      - 'tests/windows-tooling/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-native-m0.yml'
      - '.cargo/**'
      - 'core/**'
      - 'tools/windows/**'
      - 'tools/lib.sh'
      - 'tools/scan-secrets'
      - 'tests/windows-tooling/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.97.1

jobs:
  verify:
    name: Native build and tooling
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Identify clean host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          git --version
          python --version
          $pythonVersion = python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          if ([version]$pythonVersion -lt [version]'3.10') {
            throw "Python >= 3.10 is required; found $pythonVersion"
          }
          rustup --version

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_TOOLCHAIN `
            --profile minimal `
            --component rustfmt,clippy `
            --target x86_64-unknown-uefi,x86_64-unknown-none
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Rust $env:RUST_TOOLCHAIN" }
          rustup override set $env:RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw "Failed to select Rust $env:RUST_TOOLCHAIN" }
          rustup show active-toolchain
          rustc --version
          cargo --version
          rustup component list --installed
          rustup target list --installed

      - name: Doctor (boot environment informational)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python tools/windows/malrynth.py doctor
          $doctorExit = $LASTEXITCODE
          Write-Host "Doctor exit code: $doctorExit"
          Write-Host "QEMU and OVMF are optional in Windows native M0 build CI; boot is not exercised."
          if ($doctorExit -notin 0, 1) { throw "Doctor failed unexpectedly with exit code $doctorExit" }
          exit 0

      - name: Repository hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check

      - name: Scan for secrets with Git Bash
        shell: bash
        run: ./tools/scan-secrets

      - name: Windows tooling tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests/windows-tooling -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Windows tooling tests failed" }

      - name: Same-host reproducibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests/windows-tooling -p "test_reproducibility.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Same-host reproducibility failed" }

      - name: Native Windows M0 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/windows/malrynth.py build
          if ($LASTEXITCODE -ne 0) { throw "Native Windows M0 build failed" }

      - name: Verify artifacts and report hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/windows/malrynth.py verify
          if ($LASTEXITCODE -ne 0) { throw "Artifact structural verification failed" }

          $loader = 'esp\EFI\BOOT\BOOTX64.EFI'
          $kernel = 'esp\malrynth\kernel.elf'
          foreach ($artifact in @($loader, $kernel)) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Required artifact missing: $artifact"
            }
            $item = Get-Item -LiteralPath $artifact
            if ($item.Length -le 0) { throw "Required artifact is empty: $artifact" }
            $hash = Get-FileHash -LiteralPath $artifact -Algorithm SHA256
            Write-Host "$artifact size=$($item.Length) sha256=$($hash.Hash.ToLowerInvariant())"
          }

          if (Test-Path -LiteralPath 'build\size-report.txt') {
            Get-Content -LiteralPath 'build\size-report.txt'
          }
