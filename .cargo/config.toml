# Malrynth cargo configuration.
#
# This file is committed and must stay machine-independent: no absolute paths, no
# host-specific toolchain locations, no target directory override.
#
# NOTE ON RUSTFLAGS
# -----------------
# Deliberately empty of `rustflags`. Cargo's `RUSTFLAGS` environment variable REPLACES
# `target.<triple>.rustflags` rather than merging with it, so flags defined here would be
# silently dropped the moment `tools/build` sets `RUSTFLAGS` for reproducible builds.
# Having two mechanisms that silently override each other is exactly the kind of invisible
# failure this project refuses to ship.
#
# The single source of truth is `KERNEL_RUSTFLAGS` / `LOADER_RUSTFLAGS` in tools/lib.sh.
#
# The one property that must hold even under a bare `cargo build` -- that the kernel is a
# non-PIE ET_EXEC image, because malboot performs no relocation -- is enforced by
# `core/kernel/build.rs` as a link argument, which travels with the crate and cannot be
# overridden by RUSTFLAGS. The loader independently verifies e_type at boot.
